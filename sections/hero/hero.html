<section class="hero" aria-labelledby="hero-title">
  <div class="container">
    <div class="hero__panel">
      <div class="hero__content">
        <!-- <p class="hero__eyebrow">Дом Климата · Пермь</p> -->
        <h1 class="hero__title" id="hero-title">Кондиционеры и&nbsp;климатическое оборудование в&nbsp;Перми</h1>
        <p class="hero__text">Продажа, подбор, монтаж и&nbsp;обслуживание климатического оборудования.</p>
        <div class="hero__actions">
          <a class="button button--accent button--lg" href="{{root}}catalog/">Перейти в каталог</a>
          <button class="button button--outline button--lg" type="button" data-open-request>Рассчитать монтаж</button>
        </div>
      </div>
      <picture class="hero__media">
        <source media="(max-width: 640px)" srcset="{{root}}img/photos/hero-comfort-mobile.webp">
        <img src="{{root}}img/photos/hero-comfort.webp" width="1536" height="1024" alt="Настенный кондиционер в светлой гостиной с серым диваном" fetchpriority="high">
      </picture>
    </div>
  </div>
</section>
