<!-- ==========================================================================
     Секция: Страница не найдена
     Блок БЭМ: .not-found
     ========================================================================== -->
<section class="not-found" aria-labelledby="not-found-title">
  <div class="not-found__inner container">
    <p class="not-found__code">404</p>
    <h1 class="not-found__title" id="not-found-title">Такой страницы нет</h1>
    <p class="not-found__text">Возможно, она переехала. Начните с каталога или позвоните нам: подскажем, где найти нужное.</p>
    <div class="not-found__actions">
      <a class="button button--primary button--lg" href="{{root}}catalog/">Перейти в каталог</a>
      <a class="button button--outline button--lg" href="{{root}}index.html">На главную</a>
    </div>
  </div>
</section>
