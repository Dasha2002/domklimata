<!-- ==========================================================================
     Секция: Контакты (карта)
     Блок БЭМ: .contacts
     Идёт сразу после секции cta (форма заявки и телефоны): вместе это
     блок «Контакты» из ТЗ — адрес, телефон, режим работы, карта,
     построение маршрута и форма заявки.
     Карта — виджет Яндекс Карт по адресу, грузится лениво.
     ========================================================================== -->
<section class="contacts" id="contacts" aria-labelledby="contacts-title">
  <div class="container">
    <div class="contacts__map">
      <iframe class="contacts__frame" title="Карта: офис Дом Климата, Пермь, ул. Трамвайная, 27"
              src="https://yandex.ru/map-widget/v1/?text=%D0%9F%D0%B5%D1%80%D0%BC%D1%8C%2C%20%D1%83%D0%BB.%20%D0%A2%D1%80%D0%B0%D0%BC%D0%B2%D0%B0%D0%B9%D0%BD%D0%B0%D1%8F%2C%2027&amp;z=16"
              loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>

      <div class="contacts__card">
        <h2 class="contacts__title" id="contacts-title">Офис и шоурум</h2>
        <ul class="contacts__list">
          <li>
            <span class="icon icon--map-pin" aria-hidden="true"></span>
            <span>Пермь, ул. Трамвайная, 27, офис&nbsp;4</span>
          </li>
          <li>
            <span class="icon icon--clock" aria-hidden="true"></span>
            <span>Пн-Пт, 9:00-18:00</span>
          </li>
          <li>
            <span class="icon icon--phone" aria-hidden="true"></span>
            <a href="tel:+73422717711">+7 (342) 271-77-11</a>
          </li>
        </ul>
        <a class="button button--primary contacts__route"
           href="https://yandex.ru/maps/?rtext=~%D0%9F%D0%B5%D1%80%D0%BC%D1%8C%2C%20%D1%83%D0%BB.%20%D0%A2%D1%80%D0%B0%D0%BC%D0%B2%D0%B0%D0%B9%D0%BD%D0%B0%D1%8F%2C%2027&amp;rtt=auto"
           target="_blank" rel="noopener noreferrer">
          Построить маршрут
          <span class="icon icon--arrow-up-right" aria-hidden="true"></span>
        </a>
      </div>
    </div>
  </div>
</section>
