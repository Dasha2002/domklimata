<!-- ==========================================================================
     Уведомление о cookie
     Блок БЭМ: .cookie
     Показывается, пока посетитель не нажал «Понятно» (localStorage).
     ========================================================================== -->
<div class="cookie" id="cookie-notice" role="region" aria-label="Уведомление о cookie" hidden>
  <p class="cookie__text">
    Мы используем cookie для работы сайта и анализа посещаемости.
    Подробнее в <a href="{{root}}politika/" target="_blank">политике конфиденциальности</a>.
  </p>
  <button class="button button--primary cookie__button" type="button" data-cookie-accept>Понятно</button>
</div>
