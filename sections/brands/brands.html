<!-- ==========================================================================
     Секция: Официальные представители брендов
     Блок БЭМ: .brands
     Бегущая лента: app.js (initMarquee) дублирует список для бесшовного
     цикла. При prefers-reduced-motion лента стоит, логотипы переносятся.
     ========================================================================== -->
<section class="brands" aria-labelledby="brands-title">
  <div class="container">
    <h2 class="section-title" id="brands-title">Официальные представители брендов</h2>
    <p class="section-lead">Продаём технику с гарантией производителя.</p>
  </div>

  <div class="brands__marquee" data-marquee>
    <ul class="brands__track">
      <li class="brands__item"><img src="{{root}}img/brands/daikin.webp" width="360" height="128" alt="Daikin" loading="lazy"></li>
      <li class="brands__item"><img src="{{root}}img/brands/midea.webp" width="360" height="128" alt="Midea" loading="lazy"></li>
      <li class="brands__item"><img src="{{root}}img/brands/haier.webp" width="360" height="128" alt="Haier" loading="lazy"></li>
      <li class="brands__item"><img src="{{root}}img/brands/axioma.webp" width="360" height="128" alt="Axioma" loading="lazy"></li>
      <li class="brands__item"><img src="{{root}}img/brands/lessar.webp" width="360" height="128" alt="Lessar" loading="lazy"></li>
      <li class="brands__item"><img src="{{root}}img/brands/kentatsu.webp" width="360" height="128" alt="Kentatsu" loading="lazy"></li>
      <li class="brands__item"><img src="{{root}}img/brands/daichi.webp" width="360" height="128" alt="Daichi" loading="lazy"></li>
      <li class="brands__item"><img src="{{root}}img/brands/royalclima.webp" width="360" height="128" alt="Royal Clima" loading="lazy"></li>
    </ul>
  </div>
</section>
